<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffb3c7">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>SELI'S LITTLE WORLD</title>
  <style>
:root {
  --pink: #ff7eb0;
  --pink-soft: rgba(255, 190, 215, 0.55);
  --ink: #3a1d33;
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: #cfe8ef;
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Tahoma, sans-serif;
  color: var(--ink);
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  overscroll-behavior: none;
}

#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#camzone { position: fixed; inset: 0; touch-action: none; z-index: 1; }

/* ---------- HUD ---------- */
#hud { position: fixed; top: calc(8px + var(--safe-t)); left: calc(10px + var(--safe-l)); z-index: 5; display: flex; gap: 8px; align-items: center; pointer-events: none; }
#timeChip, #fps {
  background: rgba(40, 20, 40, 0.38);
  color: #fff;
  border-radius: 999px;
  padding: 4px 12px;
  font-size: 13px;
  backdrop-filter: blur(4px);
}
#fps { pointer-events: auto; font-variant-numeric: tabular-nums; opacity: 0.8; }

/* ---------- touch controls ---------- */
#controls { position: fixed; inset: 0; z-index: 4; pointer-events: none; }
#joyZone {
  position: absolute; left: 0; bottom: 0; width: 46%; height: 70%;
  pointer-events: auto; touch-action: none;
}
#joyBase {
  position: absolute;
  left: calc(80px + var(--safe-l)); bottom: calc(70px + var(--safe-b));
  width: 118px; height: 118px; margin: -59px 0 0 -59px;
  border-radius: 50%;
  border: 2px solid rgba(255, 255, 255, 0.55);
  background: radial-gradient(circle, rgba(255,255,255,0.2), rgba(255,160,200,0.16));
  transition: opacity 0.2s;
  opacity: 0.55;
}
#joyBase:not(.active) { top: auto; }
#joyBase.active { opacity: 1; }
#joyKnob {
  position: absolute; left: 50%; top: 50%;
  width: 54px; height: 54px; border-radius: 50%;
  transform: translate(-50%, -50%);
  background: radial-gradient(circle at 35% 30%, #fff, #ffc2da);
  box-shadow: 0 3px 10px rgba(120, 30, 80, 0.35);
}

#actions {
  position: absolute; right: calc(18px + var(--safe-r)); bottom: calc(22px + var(--safe-b));
  width: 190px; height: 170px; pointer-events: none;
}
.abtn {
  position: absolute; pointer-events: auto; touch-action: none;
  width: 58px; height: 58px; border-radius: 50%;
  border: 2px solid rgba(255, 255, 255, 0.75);
  background: linear-gradient(160deg, rgba(255,150,195,0.85), rgba(235,90,150,0.85));
  color: #fff; font-weight: 700; font-size: 12px; letter-spacing: 0.5px;
  box-shadow: 0 4px 12px rgba(120, 30, 80, 0.35);
}
.abtn.big { width: 78px; height: 78px; right: 0; bottom: 0; font-size: 14px; }
#btnAction { right: 88px; bottom: 6px; }
#btnRun { right: 36px; bottom: 92px; }
.abtn.down { transform: scale(0.92); filter: brightness(1.15); }
.abtn.on { background: linear-gradient(160deg, #ffe27a, #ffb347); color: #5a2a00; }

/* ---------- debug ---------- */
#debug {
  position: fixed; top: calc(40px + var(--safe-t)); left: calc(10px + var(--safe-l)); z-index: 20;
  display: flex; flex-wrap: wrap; gap: 6px; max-width: 62vw;
  padding: 8px; border-radius: 12px; background: rgba(30, 15, 35, 0.72);
}
#debug[hidden] { display: none; }
#debug button {
  border: 0; border-radius: 8px; padding: 6px 9px; font-size: 12px;
  background: rgba(255, 255, 255, 0.9); color: var(--ink);
}
#debug .hdr { width: 100%; color: #fff; font-size: 11px; opacity: 0.8; }

#toast {
  position: fixed; left: 50%; top: calc(14px + var(--safe-t)); transform: translateX(-50%);
  z-index: 30; padding: 8px 16px; border-radius: 14px; font-size: 14px;
  background: rgba(255, 255, 255, 0.92); box-shadow: 0 4px 16px rgba(0,0,0,0.2);
}
#toast[hidden] { display: none; }

/* ---------- overlays ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center;
  background: rgba(255, 225, 238, 0.28);
  backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
  transition: opacity 0.9s ease, visibility 0.9s;
}
.overlay.hide { opacity: 0; visibility: hidden; pointer-events: none; }
.card { text-align: center; padding: 18px 30px; }
.card h1 {
  margin: 0 0 6px; font-size: clamp(30px, 9vh, 64px); line-height: 1.02; letter-spacing: 2px;
  color: #fff; text-shadow: 0 3px 0 #e8508f, 0 6px 18px rgba(120, 20, 80, 0.45);
}
.card .sub { margin: 0 0 16px; color: #fff; text-shadow: 0 2px 8px rgba(100,20,70,0.5); font-size: 15px; }
button.primary {
  border: 0; border-radius: 999px; padding: 12px 38px; font-size: 20px; font-weight: 800; letter-spacing: 1px;
  color: #fff; background: linear-gradient(160deg, #ff8fbd, #ee4f93);
  box-shadow: 0 6px 20px rgba(200, 40, 110, 0.45);
}
button.primary:active { transform: scale(0.96); }
button.ghost { display: block; margin: 12px auto 0; border: 0; background: transparent; color: #fff; text-decoration: underline; font-size: 13px; opacity: 0.85; }
button.ghost[hidden] { display: none; }

#rotate { display: none; z-index: 60; background: rgba(40, 20, 50, 0.92); color: #fff; }
.phone-icon { font-size: 54px; animation: tilt 1.6s ease-in-out infinite; }
@keyframes tilt { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-90deg); } }
body.touch #rotate { display: flex; }
@media (orientation: landscape) { body.touch #rotate { display: none; } }

#loading {
  position: fixed; inset: 0; z-index: 70; display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: linear-gradient(#ffc9dd, #cfe8ef); transition: opacity 0.6s;
}
#loading.hide { opacity: 0; pointer-events: none; }
.spinner { width: 38px; height: 38px; border-radius: 50%; border: 4px solid rgba(255,255,255,0.7); border-top-color: #ee4f93; animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* small landscape phones (e.g. 360px tall) */
@media (max-height: 420px) {
  #actions { transform: scale(0.88); transform-origin: right bottom; }
  .card h1 { font-size: 34px; }
  #joyBase { width: 104px; height: 104px; margin: -52px 0 0 -52px; }
}

</style>
  
</head>
<body>
  <canvas id="game"></canvas>

  <!-- camera drag layer (sits under the controls) -->
  <div id="camzone"></div>

  <!-- HUD -->
  <div id="hud">
    <div id="timeChip"><span id="timeIcon">☀</span> <span id="timeText" dir="rtl"></span></div>
    <div id="fps" title="Tap for debug panel">-- fps</div>
  </div>

  <!-- touch controls -->
  <div id="controls">
    <div id="joyZone"><div id="joyBase"><div id="joyKnob"></div></div></div>
    <div id="actions">
      <button id="btnJump" class="abtn big" aria-label="Jump">JUMP</button>
      <button id="btnAction" class="abtn" aria-label="Interact">ACT</button>
      <button id="btnRun" class="abtn" aria-label="Run toggle">RUN</button>
    </div>
  </div>

  <div id="debug" hidden></div>
  <div id="toast" hidden></div>

  <!-- title screen: blurred garden behind -->
  <div id="start" class="overlay">
    <div class="card">
      <h1>SELI'S<br>LITTLE WORLD</h1>
      <p class="sub">A little 3D garden to explore</p>
      <button id="startBtn" class="primary">START ♡</button>
      <button id="resetBtn" class="ghost" hidden>New game</button>
    </div>
  </div>

  <div id="rotate" class="overlay">
    <div class="card">
      <div class="phone-icon">📱</div>
      <p>Please rotate your phone to landscape</p>
      <p dir="rtl">لطفاً گوشی را افقی کنید</p>
    </div>
  </div>

  <div id="loading"><div class="spinner"></div><p id="loadingText">Loading…</p></div>

  <script>
    // If the game script fails (no internet / CDN blocked / old browser), say so instead of spinning forever.
    function showErr(msg) {
      var t = document.getElementById('loadingText');
      if (t) t.innerHTML = 'Could not start the game.<br>' + msg + '<br><small>Check your internet connection and use an up-to-date Chrome.</small>';
      var s = document.querySelector('#loading .spinner');
      if (s) s.style.display = 'none';
    }
    window.addEventListener('error', function (e) { showErr(String(e.message || 'script error')); });
    window.addEventListener('unhandledrejection', function (e) { showErr(String(e.reason)); });
    setTimeout(function () { if (document.getElementById('loading') && !document.getElementById('loading').classList.contains('hide')) showErr('Loading is taking too long.'); }, 100000);
  </script>
  
  <script type="text/plain" id="gamecode">(() => {
